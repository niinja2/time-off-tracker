spring.application.name=timeoff

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/timeoff}
spring.datasource.username=${DB_USER:timeoff}
spring.datasource.password=${DB_PASSWORD:timeoff}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Local and test default only; Docker sets JWT_SECRET. At least 32 bytes, used as UTF-8 text (L11).
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789}
app.jwt.ttl=${JWT_TTL:PT8H}
