spring.application.name=timeoff

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/timeoff}
spring.datasource.username=${DB_USER:timeoff}
spring.datasource.password=${DB_PASSWORD:timeoff}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
